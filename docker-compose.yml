services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-konekta_raan}
      MYSQL_USER: ${DB_USER:-konekta}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root-local}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: 3001
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-konekta_raan}
      DB_USER: ${DB_USER:-konekta}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-local}
      JWT_SECRET: ${JWT_SECRET:-replace-this-local-secret-with-32-characters}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3001:3001"

  sms-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    command: ["npm", "run", "sms-worker"]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-konekta_raan}
      DB_USER: ${DB_USER:-konekta}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-local}
      SMS_PROVIDER: ${SMS_PROVIDER:-disabled}
      SMS_POLL_INTERVAL_MS: ${SMS_POLL_INTERVAL_MS:-10000}
      SMS_MAX_ATTEMPTS: ${SMS_MAX_ATTEMPTS:-5}
      SMS_FROM: ${SMS_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mysql-data:
